<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn</title>
<meta name="description" content="Short animated explainers about working with AI.">
<meta property="og:title" content="Learn">
<meta property="og:description" content="Short animated explainers about working with AI.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://learn.brajk.com/">
<meta property="og:image" content="https://learn.brajk.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="learn: Short animated explainers about working with AI.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ecebf3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16152a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ecebf3; --surface: #f8f7fc; --ink: #211f38; --muted: #6a6683; --line: #d7d4e6; --accent: #8b5cf6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16152a; --surface: #1f1e37; --ink: #efedf9; --muted: #a29dbd; --line: #2f2d4c; --accent: #a383ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16152a; --surface: #1f1e37; --ink: #efedf9; --muted: #a29dbd; --line: #2f2d4c; --accent: #a383ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    font-optical-sizing: auto;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: clamp(40px, 8vw, 96px) 24px 40px; }
  h1 {
    margin: 0;
    font-size: clamp(84px, 19vw, 200px);
    line-height: .86;
    letter-spacing: -.045em;
    font-weight: 800;
    font-variation-settings: "opsz" 96;
  }
  .lede { margin: 20px 0 0; font-size: clamp(22px, 3.2vw, 32px); line-height: 1.2; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }
  .lessons { list-style: none; margin: clamp(40px, 6vw, 72px) 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .lessons a {
    display: block; height: 100%;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .lessons a:hover, .lessons a:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
  .lessons h2 { margin: 0; font-size: 32px; line-height: 1.1; letter-spacing: -.02em; font-weight: 700; }
  .lessons p { margin: 8px 0 0; color: var(--muted); }
  .foot { margin-top: 56px; color: var(--muted); font-size: 15px; }
  @media (max-width: 520px) { .wrap { padding-left: 16px; padding-right: 16px; } }
  @media (prefers-reduced-motion: reduce) { .lessons a { transition: none; } .lessons a:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>learn</h1>
  <p class="lede">Short animated explainers about working with AI.</p>
  <ul class="lessons">
    <li><a href="effort/">
      <h2>Effort</h2>
      <p>Same model, same task, five effort levels. Watch what changes, and how it differs across Claude models.</p>
    </a></li>
  </ul>
  <p class="foot">Illustrations, not benchmarks.</p>
</div>
</body>
</html>
